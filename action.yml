name: Build and cache with niks3
description: Build a flake with nix-fast-build, push the results to niks3, and keep already cached results alive
inputs:
  server-url:
    description: niks3 server URL, such as https://cache.example.com
    required: true
  flake:
    description: Flake reference and attribute to build, such as .#checks.x86_64-linux
    required: true
  args:
    description: Extra nix-fast-build arguments, split on whitespace and newlines. Quotes work; shell expansion does not.
    default: ""
  accept-flake-config:
    description: Use the nixConfig of the target flake (substituters, keys, etc.) while evaluating, building, and downloading
    default: "true"
  upload-cached:
    description: Download outputs that only exist in other substituters and push them to niks3
    default: "true"
runs:
  using: node24
  main: dist/build.mjs
  post: dist/cleanup.mjs
